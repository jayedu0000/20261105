<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 인생네컷 - Web Photo Booth</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #ec4899;
            --accent-hover: #db2777;
            --text-color: #f8fafc;
            --text-sub: #94a3b8;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            overflow: hidden;
        }

        header {
            text-align: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 16px;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        header p {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        /* Views management */
        .view {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            animation: fadeIn 0.3s ease-in-out;
        }

        .view.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Buttons & Inputs */
        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
        }

        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background-color: #475569;
            box-shadow: 0 4px 12px rgba(71, 85, 105, 0.3);
        }

        .btn-secondary:hover {
            background-color: #334155;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 400px;
        }

        .input-group label {
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        .input-group input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--accent-color);
        }

        /* Step 1: Start Screen */
        .start-card {
            text-align: center;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .icon-hero {
            width: 80px;
            height: 80px;
            background: rgba(236, 72, 153, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
        }

        /* Step 2: Camera View */
        .camera-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 4/3;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror view */
        }

        .countdown-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .flash-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease-out;
        }

        .thumbnail-strip {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }

        .thumb-box {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            border: 2px dashed #475569;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .thumb-box.active {
            border: 2px solid var(--accent-color);
        }

        /* Step 3: Studio / Editor View */
        .editor-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
        }

        @media (min-width: 768px) {
            .editor-grid {
                grid-template-columns: 320px 1fr;
            }
        }

        .preview-area {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            padding: 16px;
            border-radius: 12px;
        }

        #finalCanvas {
            max-width: 100%;
            height: auto;
            max-height: 500px;
            border-radius: 4px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .controls-area {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .control-group {
            background: #0f172a;
            padding: 16px;
            border-radius: 12px;
        }

        .control-group h3 {
            font-size: 1rem;
            margin-bottom: 10px;
            color: var(--text-color);
        }

        .options-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .color-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .color-btn:hover, .color-btn.active {
            transform: scale(1.15);
            border-color: #fff;
        }

        .filter-btn {
            padding: 6px 12px;
            border-radius: 8px;
            background: #334155;
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .filter-btn.active {
            background: var(--accent-color);
        }

        /* Notification toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #334155;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
    <!-- EmailJS SDK for Direct Email Sending without server -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>

<div class="container">
    <header>
        <h1>
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            인생네컷 Web Booth
        </h1>
        <p>웹캠으로 촬영하고 네컷 사진을 소장해보세요!</p>
    </header>

    <!-- STEP 1: START -->
    <div id="view-start" class="view active">
        <div class="start-card">
            <div class="icon-hero">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </div>
            <h2>나만의 네컷 사진 만들기</h2>
            <p style="color: var(--text-sub); max-width: 400px;">카메라 권한을 허용하신 후 3초 간격으로 연속 4장을 촬영합니다.</p>
            <button id="btn-start" class="btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                촬영 시작하기
            </button>
        </div>
    </div>

    <!-- STEP 2: CAPTURE -->
    <div id="view-capture" class="view">
        <div class="camera-container">
            <video id="webcam" autoplay playsinline muted></video>
            <div id="countdown" class="countdown-overlay">3</div>
            <div id="flash" class="flash-overlay"></div>
        </div>

        <div class="thumbnail-strip">
            <div class="thumb-box" id="thumb-0">1</div>
            <div class="thumb-box" id="thumb-1">2</div>
            <div class="thumb-box" id="thumb-2">3</div>
            <div class="thumb-box" id="thumb-3">4</div>
        </div>

        <div style="display: flex; gap: 12px;">
            <button id="btn-shoot" class="btn">
                📸 촬영 시작 (자동 4회)
            </button>
        </div>
    </div>

    <!-- STEP 3: EDITOR & EXPORT -->
    <div id="view-editor" class="view">
        <div class="editor-grid">
            <div class="preview-area">
                <canvas id="finalCanvas"></canvas>
            </div>

            <div class="controls-area">
                <div class="control-group">
                    <h3>🎨 프레임 배경색 선택</h3>
                    <div class="options-row">
                        <button class="color-btn active" style="background:#000000;" data-color="#000000"></button>
                        <button class="color-btn" style="background:#ffffff;" data-color="#ffffff"></button>
                        <button class="color-btn" style="background:#f472b6;" data-color="#f472b6"></button>
                        <button class="color-btn" style="background:#38bdf8;" data-color="#38bdf8"></button>
                        <button class="color-btn" style="background:#a78bfa;" data-color="#a78bfa"></button>
                        <button class="color-btn" style="background:#4ade80;" data-color="#4ade80"></button>
                    </div>
                </div>

                <div class="control-group">
                    <h3>📷 필터 효과</h3>
                    <div class="options-row">
                        <button class="filter-btn active" data-filter="none">원본</button>
                        <button class="filter-btn" data-filter="grayscale">클래식 흑백</button>
                        <button class="filter-btn" data-filter="sepia">빈티지 세피아</button>
                        <button class="filter-btn" data-filter="bright">화사하게</button>
                    </div>
                </div>

                <div class="control-group">
                    <h3>✉️ 이메일 입력 (사진 받기)</h3>
                    <div class="input-group">
                        <label for="userEmail">이메일 주소</label>
                        <input type="email" id="userEmail" placeholder="example@email.com">
                    </div>
                </div>

                <div style="display: flex; flex-direction: column; gap: 10px; margin-top: auto;">
                    <button id="btn-download" class="btn">
                        📧 사진 저장 후 지메일로 보내기
                    </button>
                    <button id="btn-retry" class="btn btn-secondary">
                        🔄 다시 촬영하기
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="toast" class="toast">안내 메시지</div>

<script>
    // --- EmailJS Initialization ---
    // 실제 서비스 시 본인의 EmailJS Public Key로 변경하실 수 있습니다.
    (function(){
        try {
            emailjs.init("YOUR_PUBLIC_KEY"); // Placeholder for EmailJS public key
        } catch(e) {
            console.warn("EmailJS init failed:", e);
        }
    })();

    // --- Web Audio API (효과음 직접 구현) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBeep(freq = 440, type = 'sine', duration = 0.1) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function playShutterSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        // White noise for shutter
        const bufferSize = audioCtx.sampleRate * 0.1;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        noise.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
    }

    // --- State Management ---
    const state = {
        currentView: 'start',
        stream: null,
        capturedImages: [],
        frameColor: '#000000',
        currentFilter: 'none',
        userEmail: ''
    };

    // --- DOM Elements ---
    const views = {
        start: document.getElementById('view-start'),
        capture: document.getElementById('view-capture'),
        editor: document.getElementById('view-editor')
    };

    const webcam = document.getElementById('webcam');
    const countdownOverlay = document.getElementById('countdown');
    const flashOverlay = document.getElementById('flash');
    const finalCanvas = document.getElementById('finalCanvas');
    const emailInput = document.getElementById('userEmail');
    const toast = document.getElementById('toast');

    // --- LocalStorage Integration ---
    function loadSavedEmail() {
        try {
            const savedEmail = localStorage.getItem('photo_booth_email');
            if (savedEmail) {
                state.userEmail = savedEmail;
                emailInput.value = savedEmail;
            }
        } catch (e) {
            console.warn('LocalStorage access failed:', e);
        }
    }

    function saveEmail(email) {
        try {
            localStorage.setItem('photo_booth_email', email);
        } catch (e) {
            console.warn('LocalStorage save failed:', e);
        }
    }

    // --- Toast UI ---
    function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // --- View Navigation ---
    function switchView(viewName) {
        Object.keys(views).forEach(key => {
            views[key].classList.toggle('active', key === viewName);
        });
        state.currentView = viewName;
    }

    // --- Camera Control ---
    async function startCamera() {
        try {
            state.stream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: 1280 }, height: { ideal: 960 }, facingMode: "user" },
                audio: false
            });
            webcam.srcObject = state.stream;
            switchView('capture');
        } catch (err) {
            console.error('Camera access error:', err);
            showToast('카메라 접근 권한이 필요합니다.');
        }
    }

    function stopCamera() {
        if (state.stream) {
            state.stream.getTracks().forEach(track => track.stop());
            state.stream = null;
        }
    }

    // --- Capture Sequence ---
    async function startCaptureSequence() {
        state.capturedImages = [];
        resetThumbnails();
        document.getElementById('btn-shoot').disabled = true;

        for (let i = 0; i < 4; i++) {
            await runCountdown(3);
            triggerFlash();
            playShutterSound();
            capturePhoto(i);
            await new Promise(r => setTimeout(r, 800)); // Pause between shots
        }

        document.getElementById('btn-shoot').disabled = false;
        stopCamera();
        renderFinalCanvas();
        switchView('editor');
    }

    function runCountdown(seconds) {
        return new Promise((resolve) => {
            countdownOverlay.style.display = 'flex';
            let count = seconds;
            countdownOverlay.textContent = count;
            playBeep(600, 'sine', 0.1);

            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownOverlay.textContent = count;
                    playBeep(600, 'sine', 0.1);
                } else {
                    clearInterval(interval);
                    countdownOverlay.style.display = 'none';
                    playBeep(900, 'sine', 0.2);
                    resolve();
                }
            }, 1000);
        });
    }

    function triggerFlash() {
        flashOverlay.style.opacity = '1';
        setTimeout(() => {
            flashOverlay.style.opacity = '0';
        }, 150);
    }

    function capturePhoto(index) {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = webcam.videoWidth || 640;
        tempCanvas.height = webcam.videoHeight || 480;
        const ctx = tempCanvas.getContext('2d');

        // Mirror horizontal capture to match preview
        ctx.translate(tempCanvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(webcam, 0, 0, tempCanvas.width, tempCanvas.height);

        const dataUrl = tempCanvas.toDataURL('image/png');
        state.capturedImages.push(dataUrl);

        // Update thumbnail UI
        const thumb = document.getElementById(`thumb-${index}`);
        thumb.style.backgroundImage = `url(${dataUrl})`;
        thumb.textContent = '';
        thumb.classList.add('active');
    }

    function resetThumbnails() {
        for (let i = 0; i < 4; i++) {
            const thumb = document.getElementById(`thumb-${i}`);
            thumb.style.backgroundImage = 'none';
            thumb.textContent = i + 1;
            thumb.classList.remove('active');
        }
    }

    // --- Render Final 4-Cut Image ---
    function renderFinalCanvas() {
        const ctx = finalCanvas.getContext('2d');
        
        // Single frame configuration
        const photoWidth = 400;
        const photoHeight = 300; // 4:3 Aspect Ratio Slot
        const padding = 20;
        const footerHeight = 60;

        // Total dimensions (Vertical 4-cut layout: 1 column x 4 rows)
        const canvasWidth = photoWidth + (padding * 2);
        const canvasHeight = (photoHeight * 4) + (padding * 5) + footerHeight;

        finalCanvas.width = canvasWidth;
        finalCanvas.height = canvasHeight;

        // 1. Draw Background
        ctx.fillStyle = state.frameColor;
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);

        // Filter Setup
        let filterStyle = 'none';
        if (state.currentFilter === 'grayscale') filterStyle = 'grayscale(100%)';
        if (state.currentFilter === 'sepia') filterStyle = 'sepia(80%)';
        if (state.currentFilter === 'bright') filterStyle = 'brightness(115%) contrast(105%)';

        // 2. Draw 4 Captured Images with Aspect Ratio Preservation (Cover Crop)
        let loadedCount = 0;
        state.capturedImages.forEach((src, idx) => {
            const img = new Image();
            img.onload = () => {
                const yPos = padding + idx * (photoHeight + padding);
                
                ctx.save();
                ctx.filter = filterStyle;

                // Calculate Crop Dimensions to prevent stretching/distorting aspect ratio
                const imgAspect = img.width / img.height;
                const targetAspect = photoWidth / photoHeight;
                
                let sx, sy, sWidth, sHeight;
                if (imgAspect > targetAspect) {
                    // Image is wider -> Crop horizontal sides
                    sHeight = img.height;
                    sWidth = img.height * targetAspect;
                    sx = (img.width - sWidth) / 2;
                    sy = 0;
                } else {
                    // Image is taller -> Crop vertical sides
                    sWidth = img.width;
                    sHeight = img.width / targetAspect;
                    sx = 0;
                    sy = (img.height - sHeight) / 2;
                }

                // Draw cropped image maintaining correct aspect ratio
                ctx.drawImage(img, sx, sy, sWidth, sHeight, padding, yPos, photoWidth, photoHeight);
                ctx.restore();

                loadedCount++;
                if (loadedCount === 4) {
                    drawFooterText(ctx, canvasWidth, canvasHeight, padding);
                }
            };
            img.src = src;
        });
    }

    function drawFooterText(ctx, canvasWidth, canvasHeight, padding) {
        // Text Color Adjustment based on Frame Background
        const isWhite = state.frameColor === '#ffffff';
        ctx.fillStyle = isWhite ? '#000000' : '#ffffff';
        
        // Date & Branding
        const today = new Date().toISOString().split('T')[0].replace(/-/g, '.');
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('LIFE 4 CUTS', canvasWidth / 2, canvasHeight - padding - 20);

        ctx.font = '12px sans-serif';
        ctx.fillStyle = isWhite ? '#666666' : '#aaaaaa';
        ctx.fillText(today, canvasWidth / 2, canvasHeight - padding - 4);
    }

    // --- Direct Email Transmission (Without File Download) ---
    async function handleExport() {
        const email = emailInput.value.trim();
        if (!email) {
            showToast('사진을 전송받을 이메일 주소를 입력해주세요.');
            emailInput.focus();
            return;
        }

        saveEmail(email);

        const sendBtn = document.getElementById('btn-download');
        sendBtn.disabled = true;
        sendBtn.textContent = '⏳ 메일 전송 중...';
    // --- Export & Download / Mail Handler ---
    function handleExport() {
        const email = emailInput.value.trim();
        if (email) {
            saveEmail(email);
        }

        // 1. 인생네컷 이미지 자동 다운로드
        const link = document.createElement('a');
        const filename = `photo-booth-${Date.now()}.png`;
        link.download = filename;
        link.href = finalCanvas.toDataURL('image/png');
        link.click();

        // 2. 구글 지메일(Gmail) 웹 작성 창으로 바로 연동
        if (email) {
            showToast('사진을 저장했습니다. 지메일 작성 창을 엽니다!');
            
            const subject = encodeURIComponent("📸 [인생네컷] 웹에서 촬영한 네컷 사진입니다!");
            const body = encodeURIComponent(
                `안녕하세요!\n\n` +
                `웹 인생네컷에서 촬영한 사진이 내 기기(다운로드 폴더)에 저장되었습니다.\n` +
                `아래에 방금 다운로드된 사진 파일(${filename})을 첨부하여 전송해보세요!\n\n` +
                `감사합니다.`
            );
            
            // Gmail Web Compose URL
            const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(email)}&su=${subject}&body=${body}`;

            setTimeout(() => {
                window.open(gmailUrl, '_blank');
            }, 800);
        } else {
            showToast('사진이 내 기기에 저장되었습니다. (이메일을 입력하시면 지메일 연동이 가능합니다)');
        }
    }

    // --- Event Listeners Setup ---
    document.addEventListener('DOMContentLoaded', () => {
        loadSavedEmail();

        document.getElementById('btn-start').addEventListener('click', startCamera);
        document.getElementById('btn-shoot').addEventListener('click', startCaptureSequence);
        document.getElementById('btn-download').addEventListener('click', handleExport);

        document.getElementById('btn-retry').addEventListener('click', () => {
            switchView('start');
        });

        // Frame Color Selection
        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                state.frameColor = e.target.dataset.color;
                renderFinalCanvas();
            });
        });

        // Filter Selection
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                state.currentFilter = e.target.dataset.filter;
                renderFinalCanvas();
            });
        });
    });
</script>
</body>
</html>
