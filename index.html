<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 인생네컷 (Web Four-Cut Photo Booth)</title>
    <style>
        :root {
            --primary-color: #ff4b72;
            --secondary-color: #ff85a1;
            --bg-color: #fff0f3;
            --text-color: #333;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        header p {
            color: #666;
            font-size: 0.95rem;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 75, 114, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .step-section {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .step-section.active {
            display: flex;
        }

        /* 뷰포트 & 카메라 영역 */
        .view-container {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* 거울 모드 */
        }

        .countdown-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            font-size: 5rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .hidden {
            display: none !important;
        }

        /* 버튼 스타일 */
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(255, 75, 114, 0.3);
            margin-top: 10px;
            text-align: center;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:hover {
            background-color: #e03b60;
        }

        .btn-secondary {
            background-color: #f1f3f5;
            color: #495057;
            box-shadow: none;
        }

        .btn-secondary:hover {
            background-color: #e2e6ea;
        }

        /* 썸네일 그리드 */
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            margin-bottom: 15px;
        }

        .preview-thumb {
            aspect-ratio: 4 / 3;
            background: #eee;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #ddd;
        }

        .preview-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: none;
        }

        /* 프레임 선택 슬라이더 */
        .frame-selector-container {
            width: 100%;
            margin-bottom: 15px;
        }

        .frame-selector-container label {
            font-size: 0.9rem;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
            display: block;
        }

        .frame-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .frame-option {
            flex: 0 0 70px;
            height: 90px;
            border: 2px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            background: #fff;
            position: relative;
            transition: border-color 0.2s;
        }

        .frame-option.selected {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(255, 75, 114, 0.3);
        }

        .frame-option img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: none;
        }

        .frame-option span {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 0.7rem;
            text-align: center;
            padding: 2px 0;
        }

        /* 입력 폼 */
        .input-group {
            width: 100%;
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
        }

        /* 로딩 스피너 */
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .settings-link {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #888;
            cursor: pointer;
            text-decoration: underline;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>📸 인생네컷 부스</h1>
        <p>웹캠으로 촬영하고 나만의 프레임으로 추억을 남겨보세요!</p>
    </header>

    <div class="container">
        
        <!-- STEP 1: 촬영 대기 -->
        <div id="step-start" class="step-section active">
            <div class="view-container">
                <video id="webcam" autoplay playsinline></video>
            </div>
            <p style="text-align: center; font-size: 0.9rem; color: #666; margin-bottom: 10px;">
                준비되셨다면 아래 버튼을 눌러주세요! (총 4컷 촬영)
            </p>
            <button class="btn" id="start-btn">촬영 시작하기</button>
            <div class="settings-link" onclick="toggleSettings()">⚙️ GAS 웹앱 설정 변경</div>
        </div>

        <!-- STEP 2: 촬영 진행 -->
        <div id="step-shooting" class="step-section">
            <div class="view-container">
                <video id="shoot-video" autoplay playsinline></video>
                <div id="countdown" class="countdown-overlay hidden">3</div>
            </div>
            <div class="preview-grid" id="mini-previews">
                <div class="preview-thumb"></div>
                <div class="preview-thumb"></div>
                <div class="preview-thumb"></div>
                <div class="preview-thumb"></div>
            </div>
            <p id="shoot-status" style="font-weight: bold; color: var(--primary-color);">촬영 준비 중...</p>
        </div>

        <!-- STEP 3: 프레임 선택 및 편집 -->
        <div id="step-edit" class="step-section">
            <div class="view-container" style="background: #fff; border: 2px dashed #ddd;">
                <canvas id="result-canvas"></canvas>
            </div>
            
            <div class="frame-selector-container">
                <label>🎨 프레임 선택 (GitHub 폴더에 추가된 프레임)</label>
                <div class="frame-list" id="frame-list">
                    <!-- JavaScript로 동적 로드됨 -->
                </div>
            </div>

            <button class="btn" id="to-email-btn">이메일로 전송하기</button>
            <button class="btn btn-secondary" onclick="location.reload()">다시 촬영하기</button>
        </div>

        <!-- STEP 4: 이메일 전송 -->
        <div id="step-email" class="step-section">
            <div class="view-container" style="height: 250px; margin-bottom: 10px;">
                <canvas id="thumb-canvas" style="object-fit: contain; transform: none;"></canvas>
            </div>
            <div class="input-group">
                <label for="email-input">받으실 이메일 주소</label>
                <input type="email" id="email-input" placeholder="example@email.com">
            </div>
            <button class="btn" id="send-email-btn">사진 전송하기</button>
            <div id="loading-container" class="hidden">
                <div class="spinner"></div>
                <p style="text-align: center; font-size: 0.9rem; color: #666;">이메일로 전송 중입니다...</p>
            </div>
            <button class="btn btn-secondary" onclick="showStep('step-edit')" style="margin-top: 5px;">프레임 다시 고르기</button>
        </div>

        <!-- GAS 설정 모달/영역 -->
        <div id="settings-area" class="hidden" style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px;">
            <div class="input-group">
                <label style="font-size:0.85rem;">Google Apps Script Web App URL</label>
                <input type="text" id="gas-url-input" placeholder="https://script.google.com/macros/s/.../exec" style="font-size: 0.85rem; padding: 8px;">
            </div>
            <button class="btn" style="padding: 8px; font-size: 0.85rem;" onclick="saveGasUrl()">저장하기</button>
        </div>

    </div>

    <!-- Web Audio API 셔터음 합성용 오디오 컨텍스트 -->
    <script>
        // ==========================================
        // 📌 [프레임 설정 영역] 깃허브에 추가할 프레임 리스트
        // ==========================================
        // GitHub 레포지토리 기준 'frames/' 폴더 아래에 이미지들을 업로드하고 아래에 파일명을 추가하세요.
        // 투명 채널(.png)이 포함된 세로형(비율 3:4 또는 4컷 규격) 프레임을 권장합니다.
        const FRAME_LIST = [
            { id: 'frame1', name: '핑크퍼플', path: 'frames/frame1.png' },
            
        ];

        let currentFrameIndex = 0;
        let capturedImages = []; // 캡처된 캔버스 이미지 데이터들
        let videoStream = null;
        let gasWebappUrl = localStorage.getItem('gas_url') || '';

        // DOM 요소 로드
        const webcam = document.getElementById('webcam');
        const shootVideo = document.getElementById('shoot-video');
        const startBtn = document.getElementById('start-btn');
        const countdownEl = document.getElementById('countdown');
        const shootStatus = document.getElementById('shoot-status');
        const resultCanvas = document.getElementById('result-canvas');
        const thumbCanvas = document.getElementById('thumb-canvas');
        const frameListEl = document.getElementById('frame-list');

        // 초기 실행
        window.addEventListener('DOMContentLoaded', () => {
            initWebcam();
            initFrameSelector();
            if(gasWebappUrl) {
                document.getElementById('gas-url-input').value = gasWebappUrl;
            }
        });

        // 1. 웹캠 초기화
        async function initWebcam() {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }, 
                    audio: false 
                });
                webcam.srcObject = videoStream;
                shootVideo.srcObject = videoStream;
            } catch (err) {
                alert("웹캠 권한이 거부되었거나 카메라를 찾을 수 없습니다. 브라우저 설정을 확인해주세요.");
                console.error(err);
            }
        }

        // 2. 프레임 선택 UI 동적 생성
        function initFrameSelector() {
            frameListEl.innerHTML = '';
            FRAME_LIST.forEach((frame, idx) => {
                const opt = document.createElement('div');
                opt.className = `frame-option ${idx === currentFrameIndex ? 'selected' : ''}`;
                opt.innerHTML = `
                    <img src="${frame.path}" alt="${frame.name}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'70\' height=\'90\'><rect width=\'100%\' height=\'100%\' fill=\'%23eee\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' font-size=\'10\' fill=\'%23aaa\'>프레임</text></svg>'">
                    <span>${frame.name}</span>
                `;
                opt.addEventListener('click', () => {
                    document.querySelectorAll('.frame-option').forEach(el => el.classList.remove('selected'));
                    opt.classList.add('selected');
                    currentFrameIndex = idx;
                    renderCompositeImage();
                });
                frameListEl.appendChild(opt);
            });
        }

        // 화면 전환 함수
        function showStep(stepId) {
            document.querySelectorAll('.step-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(stepId).classList.add('active');
        }

        // Web Audio API 기반 셔터음 재생
        function playShutterSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch(e) {
                // AudioContext 차단 무시
            }
        }

        // 촬영 시작 버튼 이벤트
        startBtn.addEventListener('click', async () => {
            showStep('step-shooting');
            capturedImages = [];
            document.querySelectorAll('.preview-thumb').forEach(thumb => thumb.innerHTML = '');
            
            for (let i = 0; i < 4; i++) {
                shootStatus.innerText = `${i + 1}번째 사진 촬영 중...`;
                await runCountdown();
                playShutterSound();
                
                // 프레임 캡처
                const canvas = document.createElement('canvas');
                canvas.width = shootVideo.videoWidth || 640;
                canvas.height = shootVideo.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                // 거울모드 반전 해제하여 정방향 저장
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(shootVideo, 0, 0, canvas.width, canvas.height);
                
                capturedImages.push(canvas);
                
                // 썸네일 표시
                const thumbContainer = document.querySelectorAll('.preview-thumb')[i];
                thumbContainer.innerHTML = `<img src="${canvas.toDataURL('image/png')}" />`;
                
                if (i < 3) await wait(1000); // 컷 사이 1초 대기
            }

            shootStatus.innerText = "촬영 완료! 프레임 합성 중...";
            await wait(500);
            renderCompositeImage();
            showStep('step-edit');
        });

        function runCountdown() {
            return new Promise(resolve => {
                countdownEl.classList.remove('hidden');
                let count = 3;
                countdownEl.innerText = count;
                const timer = setInterval(() => {
                    count--;
                    if (count > 0) {
                        countdownEl.innerText = count;
                    } else {
                        clearInterval(timer);
                        countdownEl.classList.add('hidden');
                        resolve();
                    }
                }, 1000);
            });
        }

        function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // 3. Canvas 프레임 및 사진 합성 엔진
        function renderCompositeImage() {
            const width = 1200;  // 고해상도 출력 가로 세로
            const height = 1800;
            
            resultCanvas.width = width;
            resultCanvas.height = height;
            const ctx = resultCanvas.getContext('2d');

            // 기본 배경 (화이트)
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);

            // 4컷 사진이 들어갈 영역 규격 정의 (인생네컷 표준 세로형 배치 예시)
            // 레이아웃: 상단에 4컷 세로 배치 또는 2x2 배치 (여기서는 세로 일렬 4단 배치)
            const photoWidth = 1040;
            const photoHeight = 350;
            const startX = 80;
            const startY = 120;
            const gapY = 35;

            capturedImages.forEach((imgCanvas, index) => {
                const y = startY + index * (photoHeight + gapY);
                
                // 원본 사진 비율 유지하면서 자르기 (Object-fit: cover 효과)
                const imgAspect = imgCanvas.width / imgCanvas.height;
                const targetAspect = photoWidth / photoHeight;
                let sWidth = imgCanvas.width;
                let sHeight = imgCanvas.height;
                let sX = 0, sY = 0;

                if (imgAspect > targetAspect) {
                    sWidth = imgCanvas.height * targetAspect;
                    sX = (imgCanvas.width - sWidth) / 2;
                } else {
                    sHeight = imgCanvas.width / targetAspect;
                    sY = (imgCanvas.height - sHeight) / 2;
                }

                ctx.drawImage(imgCanvas, sX, sY, sWidth, sHeight, startX, y, photoWidth, photoHeight);
            });

            // 프레임 이미지 오버레이 (선택된 프레임 이미지 로드 및 그리기)
            const frameInfo = FRAME_LIST[currentFrameIndex];
            const frameImg = new Image();
            frameImg.crossOrigin = "anonymous";
            frameImg.src = frameInfo.path;
            
            frameImg.onload = () => {
                ctx.drawImage(frameImg, 0, 0, width, height);
                updateThumbCanvas();
            };

            frameImg.onerror = () => {
                // 프레임 이미지를 불러오지 못한 경우 기본 테두리 라인 드로잉
                ctx.strokeStyle = "#ff4b72";
                ctx.lineWidth = 15;
                ctx.strokeRect(40, 40, width - 80, height - 80);
                updateThumbCanvas();
            };
        }

        function updateThumbCanvas() {
            thumbCanvas.width = resultCanvas.width;
            thumbCanvas.height = resultCanvas.height;
            const tCtx = thumbCanvas.getContext('2d');
            tCtx.drawImage(resultCanvas, 0, 0);
        }

        // 4. 이메일 전송 화면 이동 및 GAS 연동
        document.getElementById('to-email-btn').addEventListener('click', () => {
            showStep('step-email');
        });

        document.getElementById('send-email-btn').addEventListener('click', async () => {
            const email = document.getElementById('email-input').value.trim();
            if (!email || !email.includes('@')) {
                alert("올바른 이메일 주소를 입력해주세요.");
                return;
            }

            if (!gasWebappUrl) {
                alert("Google Apps Script 웹앱 URL이 설정되지 않았습니다. 하단 설정에서 URL을 등록해주세요.");
                toggleSettings();
                return;
            }

            const loadingContainer = document.getElementById('loading-container');
            const sendBtn = document.getElementById('send-email-btn');
            loadingContainer.classList.remove('hidden');
            sendBtn.classList.add('hidden');

            const imageDataUrl = resultCanvas.toDataURL('image/png');

            try {
                const response = await fetch(gasWebappUrl, {
                    method: 'POST',
                    mode: 'no-cors', // GAS 리다이렉트 대응
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, image: imageDataUrl })
                });

                alert("성공적으로 이메일 전송 요청이 완료되었습니다! 수신함을 확인해주세요.");
                location.reload();
            } catch (err) {
                console.error(err);
                alert("이메일 전송 중 오류가 발생했습니다. GAS URL 및 권한을 다시 확인해주세요.");
                loadingContainer.classList.add('hidden');
                sendBtn.classList.remove('hidden');
            }
        });

        function toggleSettings() {
            const area = document.getElementById('settings-area');
            area.classList.toggle('hidden');
        }

        function saveGasUrl() {
            const url = document.getElementById('gas-url-input').value.trim();
            localStorage.setItem('gas_url', url);
            gasWebappUrl = url;
            alert("GAS 웹앱 URL이 저장되었습니다!");
            toggleSettings();
        }
    </script>
</body>
</html>
