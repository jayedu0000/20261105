<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 인생네컷 (Web Four-Cut Photo Booth)</title>
    <style>
        :root {
            --primary-color: #ff4b72;
            --secondary-color: #ff85a1;
            --bg-color: #fff0f3;
            --text-color: #333;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        header p {
            color: #666;
            font-size: 0.95rem;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 75, 114, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .step-section {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .step-section.active {
            display: flex;
        }

        /* 촬영 뷰포트 컨테이너 (실시간 프레임 오버레이 적용) */
        .booth-view-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1080 / 1350; /* 프레임 비율과 동일 */
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        /* 2x2 실시간 비디오 격자 */
        .live-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 554px 526px; /* 1080기준 비율 배분 */
            grid-template-rows: 753px 597px;
            gap: 0;
        }

        /* 각 칸별 비디오 위치 매칭 */
        .live-slot {
            position: relative;
            overflow: hidden;
            background: #000;
        }

        .live-slot:nth-child(1) { top: 265px; left: 91px; width: 434px; height: 488px; position: absolute; }
        .live-slot:nth-child(2) { top: 265px; left: 554px; width: 434px; height: 488px; position: absolute; }
        .live-slot:nth-child(3) { top: 779px; left: 91px; width: 434px; height: 488px; position: absolute; }
        .live-slot:nth-child(4) { top: 779px; left: 554px; width: 434px; height: 488px; position: absolute; }

        .live-slot video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* 거울 모드 */
        }

        /* 이미 촬영된 칸에 사진 표시용 */
        .live-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 그 위에 얹어지는 프레임 오버레이 (클릭 방지) */
        .frame-overlay-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .countdown-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            font-size: 5rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .hidden {
            display: none !important;
        }

        /* 버튼 스타일 */
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(255, 75, 114, 0.3);
            margin-top: 10px;
            text-align: center;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:hover {
            background-color: #e03b60;
        }

        .btn-secondary {
            background-color: #f1f3f5;
            color: #495057;
            box-shadow: none;
        }

        .btn-secondary:hover {
            background-color: #e2e6ea;
        }

        /* 프레임 선택 슬라이더 */
        .frame-selector-container {
            width: 100%;
            margin-bottom: 15px;
        }

        .frame-selector-container label {
            font-size: 0.9rem;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
            display: block;
        }

        .frame-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .frame-option {
            flex: 0 0 70px;
            height: 90px;
            border: 2px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            background: #fff;
            position: relative;
            transition: border-color 0.2s;
        }

        .frame-option.selected {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(255, 75, 114, 0.3);
        }

        .frame-option img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: none;
        }

        .frame-option span {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 0.7rem;
            text-align: center;
            padding: 2px 0;
        }

        /* 입력 폼 */
        .input-group {
            width: 100%;
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
        }

        /* 로딩 스피너 */
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .settings-link {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #888;
            cursor: pointer;
            text-decoration: underline;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>📸 인생네컷 부스</h1>
        <p>프레임을 먼저 고르고, 예쁜 위치에 맞춰 사진을 찍어보세요!</p>
    </header>

    <div class="container">
        
        <!-- STEP 1: 프레임 먼저 선택 -->
        <div id="step-select-frame" class="step-section active">
            <div class="frame-selector-container" style="margin-top: 10px;">
                <label>🎨 원하는 프레임을 선택하세요</label>
                <div class="frame-list" id="frame-select-list" style="justify-content: center; flex-wrap: wrap;">
                    <!-- JavaScript 동적 로드 -->
                </div>
            </div>
            <div style="width: 100%; aspect-ratio: 1080/1350; background: #eee; border-radius: 12px; overflow: hidden; margin-bottom: 15px; display: flex; justify-content: center; align-items: center;">
                <img id="preview-frame-cover" src="" alt="프레임 미리보기" style="width: 100%; height: 100%; object-fit: contain;">
            </div>
            <button class="btn" id="start-shooting-btn">이 프레임으로 촬영 시작하기</button>
            <div class="settings-link" onclick="toggleSettings()">⚙️ GAS 웹앱 설정 변경</div>
        </div>

        <!-- STEP 2: 프레임 보면서 실시간 촬영 -->
        <div id="step-shooting" class="step-section">
            <div class="booth-view-container" id="booth-container">
                <!-- 4개의 실시간 카메라 칸 -->
                <div class="live-grid">
                    <div class="live-slot" id="slot-0"><video class="cam-video" autoplay playsinline></video></div>
                    <div class="live-slot" id="slot-1"><video class="cam-video" autoplay playsinline></video></div>
                    <div class="live-slot" id="slot-2"><video class="cam-video" autoplay playsinline></video></div>
                    <div class="live-slot" id="slot-3"><video class="cam-video" autoplay playsinline></video></div>
                </div>
                <!-- 투명 구멍이 뚫린 프레임 오버레이 이미지 -->
                <img id="active-frame-overlay" class="frame-overlay-img" src="" alt="프레임">
                <div id="countdown" class="countdown-overlay hidden">3</div>
            </div>
            <p id="shoot-status" style="font-weight: bold; color: var(--primary-color); text-align: center; margin-bottom: 10px;">프레임 위치를 보며 포즈를 잡으세요!</p>
        </div>

        <!-- STEP 3: 최종 결과 확인 및 이메일 전송 -->
        <div id="step-email" class="step-section">
            <div class="view-container" style="background: #fff; border: 2px dashed #ddd; aspect-ratio: 1080/1350; width: 100%; margin-bottom: 15px; position: relative;">
                <canvas id="result-canvas" style="width: 100%; height: 100%; object-fit: contain; transform: none;"></canvas>
            </div>
            <div class="input-group">
                <label for="email-input">받으실 이메일 주소</label>
                <input type="email" id="email-input" placeholder="example@email.com">
            </div>
            <button class="btn" id="send-email-btn">사진 전송하기</button>
            <div id="loading-container" class="hidden">
                <div class="spinner"></div>
                <p style="text-align: center; font-size: 0.9rem; color: #666;">이메일로 전송 중입니다...</p>
            </div>
            <button class="btn btn-secondary" onclick="location.reload()" style="margin-top: 5px;">처음으로 돌아가기</button>
        </div>

        <!-- GAS 설정 모달/영역 -->
        <div id="settings-area" class="hidden" style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px;">
            <div class="input-group">
                <label style="font-size:0.85rem;">Google Apps Script Web App URL</label>
                <input type="text" id="gas-url-input" placeholder="https://script.google.com/macros/s/.../exec" style="font-size: 0.85rem; padding: 8px;">
            </div>
            <button class="btn" style="padding: 8px; font-size: 0.85rem;" onclick="saveGasUrl()">저장하기</button>
        </div>

    </div>

    <script>
        // ==========================================
        // 📌 [프레임 설정 영역] 깃허브 frames 폴더 안의 이미지 리스트
        // ==========================================
        const FRAME_LIST = [
            { id: 'frame1', name: '기본 프레임', path: 'frames/frame1.png' },
            { id: 'frame2', name: '할로윈 호박 프레임', path: 'frames/frame2.png' }
        ];

        let currentFrameIndex = 0;
        let capturedImages = [];
        let videoStream = null;
        let gasWebappUrl = localStorage.getItem('gas_url') || '';

        const resultCanvas = document.getElementById('result-canvas');

        window.addEventListener('DOMContentLoaded', () => {
            initWebcamStream();
            initFrameSelectorUI();
            if(gasWebappUrl) {
                document.getElementById('gas-url-input').value = gasWebappUrl;
            }
        });

        async function initWebcamStream() {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }, 
                    audio: false 
                });
                // 모든 실시간 비디오 태그에 스트림 연결
                document.querySelectorAll('.cam-video').forEach(video => {
                    video.srcObject = videoStream;
                });
            } catch (err) {
                alert("웹캠 권한이 거부되었거나 카메라를 찾을 수 없습니다. 브라우저 설정을 확인해주세요.");
                console.error(err);
            }
        }

        function initFrameSelectorUI() {
            const listEl = document.getElementById('frame-select-list');
            listEl.innerHTML = '';
            FRAME_LIST.forEach((frame, idx) => {
                const opt = document.createElement('div');
                opt.className = `frame-option ${idx === currentFrameIndex ? 'selected' : ''}`;
                opt.innerHTML = `
                    <img src="${frame.path}" alt="${frame.name}">
                    <span>${frame.name}</span>
                `;
                opt.addEventListener('click', () => {
                    document.querySelectorAll('.frame-option').forEach(el => el.classList.remove('selected'));
                    opt.classList.add('selected');
                    currentFrameIndex = idx;
                    updatePreviewCover();
                });
                listEl.appendChild(opt);
            });
            updatePreviewCover();
        }

        function updatePreviewCover() {
            const cover = document.getElementById('preview-frame-cover');
            cover.src = FRAME_LIST[currentFrameIndex].path;
        }

        function showStep(stepId) {
            document.querySelectorAll('.step-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(stepId).classList.add('active');
        }

        function playShutterSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch(e) {}
        }

        // 촬영 시작 버튼 클릭 시
        document.getElementById('start-shooting-btn').addEventListener('click', async () => {
            // 선택한 프레임을 촬영 화면의 오버레이로 적용
            const activeFramePath = FRAME_LIST[currentFrameIndex].path;
            document.getElementById('active-frame-overlay').src = activeFramePath;

            showStep('step-shooting');
            capturedImages = [];

            // 비디오 스트림 다시 확실히 연결
            document.querySelectorAll('.cam-video').forEach(video => {
                if(!video.srcObject && videoStream) video.srcObject = videoStream;
            });

            const slots = document.querySelectorAll('.live-slot');
            
            for (let i = 0; i < 4; i++) {
                const slot = slots[i];
                const videoEl = slot.querySelector('video');
                
                document.getElementById('shoot-status').innerText = `${i + 1}번째 칸 촬영 준비 (3초 뒤 찰칵!)`;
                await runCountdown();
                playShutterSound();
                
                // 해당 칸의 비디오 화면을 캡처하여 이미지로 변환 후 고정
                const canvas = document.createElement('canvas');
                canvas.width = videoEl.videoWidth || 640;
                canvas.height = videoEl.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
                
                capturedImages.push(canvas);

                // 비디오를 숨기고 찍힌 사진으로 교체
                videoEl.classList.add('hidden');
                const img = document.createElement('img');
                img.src = canvas.toDataURL('image/png');
                slot.appendChild(img);
                
                if (i < 3) await wait(1000);
            }

            document.getElementById('shoot-status').innerText = "촬영 완료! 최종 결과물 생성 중...";
            await wait(800);
            renderFinalCompositeImage();
            showStep('step-email');
        });

        function runCountdown() {
            return new Promise(resolve => {
                const countdownEl = document.getElementById('countdown');
                countdownEl.classList.remove('hidden');
                let count = 3;
                countdownEl.innerText = count;
                const timer = setInterval(() => {
                    count--;
                    if (count > 0) {
                        countdownEl.innerText = count;
                    } else {
                        clearInterval(timer);
                        countdownEl.classList.add('hidden');
                        resolve();
                    }
                }, 1000);
            });
        }

        function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // 최종 캔버스 고화질 합성 엔진 (1080x1350)
        function renderFinalCompositeImage() {
            const width = 1080;  
            const height = 1350; 
            
            resultCanvas.width = width;
            resultCanvas.height = height;
            const ctx = resultCanvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);

            const slotsCoords = [
                { x: 91.3,  y: 265.4, w: 434, h: 488 },
                { x: 554.5, y: 265.4, w: 434, h: 488 },
                { x: 91.3,  y: 779.0, w: 434, h: 488 },
                { x: 554.5, y: 779.0, w: 434, h: 488 }
            ];

            // 1단계: 찍힌 사진 4장을 좌표에 맞게 그리기
            capturedImages.forEach((imgCanvas, index) => {
                if (!slotsCoords[index]) return;
                const slot = slotsCoords[index];

                const imgAspect = imgCanvas.width / imgCanvas.height;
                const targetAspect = slot.w / slot.h;
                let sWidth = imgCanvas.width;
                let sHeight = imgCanvas.height;
                let sX = 0, sY = 0;

                if (imgAspect > targetAspect) {
                    sWidth = imgCanvas.height * targetAspect;
                    sX = (imgCanvas.width - sWidth) / 2;
                } else {
                    sHeight = imgCanvas.width / targetAspect;
                    sY = (imgCanvas.height - sHeight) / 2;
                }

                ctx.drawImage(imgCanvas, sX, sY, sWidth, sHeight, slot.x, slot.y, slot.w, slot.h);
            });

            // 2단계: 그 위에 선택한 프레임 덮어씌우기
            const frameInfo = FRAME_LIST[currentFrameIndex];
            const frameImg = new Image();
            frameImg.crossOrigin = "anonymous";
            frameImg.src = frameInfo.path;
            
            frameImg.onload = () => {
                ctx.drawImage(frameImg, 0, 0, width, height);
            };
        }

        // 이메일 전송 버튼
        document.getElementById('send-email-btn').addEventListener('click', async () => {
            const email = document.getElementById('email-input').value.trim();
            if (!email || !email.includes('@')) {
                alert("올바른 이메일 주소를 입력해주세요.");
                return;
            }

            if (!gasWebappUrl) {
                alert("Google Apps Script 웹앱 URL이 설정되지 않았습니다. 하단 설정에서 URL을 등록해주세요.");
                toggleSettings();
                return;
            }

            const loadingContainer = document.getElementById('loading-container');
            const sendBtn = document.getElementById('send-email-btn');
            loadingContainer.classList.remove('hidden');
            sendBtn.classList.add('hidden');

            const imageDataUrl = resultCanvas.toDataURL('image/png');

            try {
                await fetch(gasWebappUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, image: imageDataUrl })
                });

                alert("성공적으로 이메일 전송 요청이 완료되었습니다! 수신함을 확인해주세요.");
                location.reload();
            } catch (err) {
                console.error(err);
                alert("이메일 전송 중 오류가 발생했습니다. GAS URL 및 권한을 다시 확인해주세요.");
                loadingContainer.classList.add('hidden');
                sendBtn.classList.remove('hidden');
            }
        });

        function toggleSettings() {
            const area = document.getElementById('settings-area');
            area.classList.toggle('hidden');
        }

        function saveGasUrl() {
            const url = document.getElementById('gas-url-input').value.trim();
            localStorage.setItem('gas_url', url);
            gasWebappUrl = url;
            alert("GAS 웹앱 URL이 저장되었습니다!");
            toggleSettings();
        }
    </script>
</body>
</html>
