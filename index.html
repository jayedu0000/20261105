<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 인생네컷 (Web Four-Cut Photo Booth)</title>
    <style>
        :root {
            --primary-color: #ff4b72;
            --secondary-color: #ff85a1;
            --bg-color: #fff0f3;
            --text-color: #333;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        header p {
            color: #666;
            font-size: 0.95rem;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 75, 114, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .step-section {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .step-section.active {
            display: flex;
        }

        /* 뷰포트 & 카메라 영역 */
        .view-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 5;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* 거울 모드 */
        }

        .countdown-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            font-size: 5rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .hidden {
            display: none !important;
        }

        /* 버튼 스타일 */
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(255, 75, 114, 0.3);
            margin-top: 10px;
            text-align: center;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:hover {
            background-color: #e03b60;
        }

        .btn-secondary {
            background-color: #f1f3f5;
            color: #495057;
            box-shadow: none;
        }

        .btn-secondary:hover {
            background-color: #e2e6ea;
        }

        /* 썸네일 그리드 (2x2) */
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            margin-bottom: 15px;
        }

        .preview-thumb {
            aspect-ratio: 4 / 3;
            background: #eee;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #ddd;
        }

        .preview-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: none;
        }

        /* 프레임 선택 슬라이더 */
        .frame-selector-container {
            width: 100%;
            margin-bottom: 15px;
        }

        .frame-selector-container label {
            font-size: 0.9rem;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
            display: block;
        }

        .frame-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .frame-option {
            flex: 0 0 70px;
            height: 90px;
            border: 2px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            background: #fff;
            position: relative;
            transition: border-color 0.2s;
        }

        .frame-option.selected {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(255, 75, 114, 0.3);
        }

        .frame-option img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: none;
        }

        .frame-option span {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 0.7rem;
            text-align: center;
            padding: 2px 0;
        }

        /* 입력 폼 */
        .input-group {
            width: 100%;
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
        }

        /* 로딩 스피너 */
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .settings-link {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #888;
            cursor: pointer;
            text-decoration: underline;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>📸 인생네컷 부스</h1>
        <p>웹캠으로 촬영하고 나만의 프레임으로 추억을 남겨보세요!</p>
    </header>

    <div class="container">
        
        <!-- STEP 1: 촬영 대기 -->
        <div id="step-start" class="step-section active">
            <div class="view-container">
                <video id="webcam" autoplay playsinline></video>
            </div>
            <p style="text-align: center; font-size: 0.9rem; color: #666; margin-bottom: 10px;">
                준비되셨다면 아래 버튼을 눌러주세요! (총 4컷 촬영)
            </p>
            <button class="btn" id="start-btn">촬영 시작하기</button>
            <div class="settings-link" onclick="toggleSettings()">⚙️ GAS 웹앱 설정 변경</div>
        </div>

        <!-- STEP 2: 촬영 진행 -->
        <div id="step-shooting" class="step-section">
            <div class="view-container">
                <video id="shoot-video" autoplay playsinline></video>
                <div id="countdown" class="countdown-overlay hidden">3</div>
            </div>
            <div class="preview-grid" id="mini-previews">
                <div class="preview-thumb"></div>
                <div class="preview-thumb"></div>
                <div class="preview-thumb"></div>
                <div class="preview-thumb"></div>
            </div>
            <p id="shoot-status" style="font-weight: bold; color: var(--primary-color);">촬영 준비 중...</p>
        </div>

        <!-- STEP 3: 프레임 선택 및 편집 -->
        <div id="step-edit" class="step-section">
            <div class="view-container" style="background: #fff; border: 2px dashed #ddd;">
                <canvas id="result-canvas" style="transform: none;"></canvas>
            </div>
            
            <div class="frame-selector-container">
                <label>🎨 프레임 선택</label>
                <div class="frame-list" id="frame-list">
                    <!-- JavaScript로 동적 로드됨 -->
                </div>
            </div>

            <button class="btn" id="to-email-btn">이메일로 전송하기</button>
            <button class="btn btn-secondary" onclick="location.reload()">다시 촬영하기</button>
        </div>
